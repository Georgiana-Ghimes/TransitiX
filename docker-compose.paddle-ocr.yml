# Local PaddleOCR sidecar for Transitix (CPU).
# Usage from repo root:
#   docker compose -f docker-compose.paddle-ocr.yml up -d --build
# Health: http://127.0.0.1:8100/health
services:
  paddle-ocr:
    build:
      context: ./tools/paddle-ocr
    ports:
      - "8100:8100"
    environment:
      PADDLE_OCR_LANG: ${PADDLE_OCR_LANG:-latin}
      PADDLE_OCR_USE_GPU: "0"
      PADDLE_OCR_AUTO_ROTATE: ${PADDLE_OCR_AUTO_ROTATE:-1}
      # Longest side the text detector may see. PaddleOCR's default is 960, which squashes a
      # handwritten carnet line to ~22px and finds nothing. Turn DOWN if the VM runs out of CPU.
      PADDLE_OCR_DET_SIDE_LEN: ${PADDLE_OCR_DET_SIDE_LEN:-1920}
      # PaddleOCR throws away any line it read below this confidence. Handwriting comes back at
      # 0.1-0.3 even when correct, so the printed-text default of 0.35 deletes a whole carnet
      # and the caller sees an empty read instead of a poor one.
      PADDLE_OCR_DROP_SCORE: ${PADDLE_OCR_DROP_SCORE:-0.10}
      # Load models at container start instead of on the first aviz of the day.
      PADDLE_OCR_WARMUP: ${PADDLE_OCR_WARMUP:-1}
      # Intel CPU kernels (~2x). Set to 0 if memory grows across a long scan.
      PADDLE_OCR_MKLDNN: ${PADDLE_OCR_MKLDNN:-1}
      # Paddle's own default is 10 threads, which oversubscribes a small shared VM.
      PADDLE_OCR_CPU_THREADS: ${PADDLE_OCR_CPU_THREADS:-4}
    restart: unless-stopped
    # A ceiling, not a reservation: OCR is the one process here that can grow without bound,
    # and Postgres plus the API have to survive it. Hitting the memory limit kills only this
    # container, which `restart` brings back — that is the outcome to prefer over a dead VM.
    deploy:
      resources:
        limits:
          cpus: "${PADDLE_OCR_CPUS:-4}"
          memory: ${PADDLE_OCR_MEMORY:-4g}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    volumes:
      # Persist downloaded OCR models between rebuilds
      - paddle_ocr_models:/root/.paddleocr

volumes:
  paddle_ocr_models:
