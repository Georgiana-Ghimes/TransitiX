# Local PaddleOCR sidecar for Transitix (CPU).
# Usage from repo root:
#   docker compose -f docker-compose.paddle-ocr.yml up -d --build
# Health: http://127.0.0.1:8100/health
services:
  paddle-ocr:
    build:
      context: ./tools/paddle-ocr
    ports:
      - "8100:8100"
    environment:
      PADDLE_OCR_LANG: ${PADDLE_OCR_LANG:-latin}
      PADDLE_OCR_USE_GPU: "0"
      PADDLE_OCR_AUTO_ROTATE: ${PADDLE_OCR_AUTO_ROTATE:-1}
      # Longest side the text detector may see. PaddleOCR's default is 960, which squashes a
      # handwritten carnet line to ~22px and finds nothing. Turn DOWN if the VM runs out of CPU.
      PADDLE_OCR_DET_SIDE_LEN: ${PADDLE_OCR_DET_SIDE_LEN:-1920}
      # PaddleOCR throws away any line it read below this confidence. Handwriting comes back at
      # 0.1-0.3 even when correct, so the printed-text default of 0.35 deletes a whole carnet
      # and the caller sees an empty read instead of a poor one.
      PADDLE_OCR_DROP_SCORE: ${PADDLE_OCR_DROP_SCORE:-0.10}
      HYBRID_OCR: ${HYBRID_OCR:-1}
      MEMORY_PROFILE: ${MEMORY_PROFILE:-host}
      HW_BIAS: ${HW_BIAS:-1}
      CLASSIFIER_BACKEND: ${CLASSIFIER_BACKEND:-heuristic}
      PRINTED_FALLBACK_CONF: ${PRINTED_FALLBACK_CONF:-0.5}
      HANDWRITING_THRESHOLD: ${HANDWRITING_THRESHOLD:-0.75}
      HANDWRITING_MIN_LEN: ${HANDWRITING_MIN_LEN:-2}
      HANDWRITING_PADDLE_KEEP: ${HANDWRITING_PADDLE_KEEP:-0.55}
      TROCR_UNLOAD_AFTER_REQUEST: ${TROCR_UNLOAD_AFTER_REQUEST:-1}
      ORT_INTRA_THREADS: ${ORT_INTRA_THREADS:-2}
      OCR_ONNX_DIR: /root/.paddleocr/onnx
      TROCR_ONNX: trocr-small-handwritten-v1
    restart: unless-stopped
    volumes:
      # Persist downloaded OCR models between rebuilds (+ TrOCR ONNX under onnx/)
      - paddle_ocr_models:/root/.paddleocr

volumes:
  paddle_ocr_models:
