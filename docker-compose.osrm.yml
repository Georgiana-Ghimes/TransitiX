# OSRM routing sidecar — real road distances, durations and matrices (P0).
#
# The graph must be built once before this can start:
#   npm run osrm:prepare          (downloads the OSM extract, runs extract/partition/customize)
#
# Then bring it up alongside the database:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.osrm.yml up -d db osrm
#
# Point the API at it with OSRM_URL=http://localhost:5000 in server/.env
# (inside the full Compose stack the api service reaches it as http://osrm:5000).
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    # --max-table-size caps how many points one matrix call may carry. OSRM defaults to 100;
    # the optimizer in P2 routinely asks for more, so raise it here and cap again in code.
    command: >
      osrm-routed --algorithm mld
      --max-table-size 512
      --max-matching-size 100
      /data/${OSRM_EXTRACT:-romania-latest}.osrm
    volumes:
      - ./docker/osrm:/data
    ports:
      - "${OSRM_PORT:-5000}:5000"
    healthcheck:
      test:
        - CMD
        - osrm-routed
        - --version
      interval: 30s
      timeout: 5s
      retries: 3
