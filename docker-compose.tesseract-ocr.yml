# Local Tesseract OCR sidecar (Romanian + English) for handwriting experiments.
# Usage from repo root:
#   docker compose -f docker-compose.tesseract-ocr.yml up -d --build
# Health: http://127.0.0.1:8102/health
services:
  tesseract-ocr:
    build:
      context: ./tools/tesseract-ocr
    ports:
      - "8102:8102"
    environment:
      TESSERACT_LANG: ${TESSERACT_LANG:-ron+eng}
      TESSERACT_PSM: ${TESSERACT_PSM:-6}
      TESSERACT_OEM: ${TESSERACT_OEM:-3}
      TESSERACT_OCR_PDF_PAGES: ${TESSERACT_OCR_PDF_PAGES:-8}
    restart: unless-stopped
