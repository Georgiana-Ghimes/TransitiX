# RAI Spedition documents companion — isolated Postgres + Paddle OCR.
# Does not touch the main Transitix stack (other ports, other DB volume).
#
#   docker compose -f docker-compose.companion.yml up -d --build
#
# Postgres: localhost:5435 / DB transitix_rai
# Paddle OCR: localhost:8101

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transitix_rai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - transitix_rai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-transitix_rai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  paddle-ocr:
    build:
      context: ./tools/paddle-ocr
    ports:
      - "8101:8100"
    environment:
      PADDLE_OCR_LANG: ${PADDLE_OCR_LANG:-latin}
      PADDLE_OCR_USE_GPU: "0"
      PADDLE_OCR_AUTO_ROTATE: ${PADDLE_OCR_AUTO_ROTATE:-1}
      # Default 960 squashes handwritten carnet lines below what the detector can see.
      PADDLE_OCR_DET_SIDE_LEN: ${PADDLE_OCR_DET_SIDE_LEN:-1920}
      # Handwriting scores 0.1–0.3; printed default 0.35 deleted whole pages.
      PADDLE_OCR_DROP_SCORE: ${PADDLE_OCR_DROP_SCORE:-0.10}
      HYBRID_OCR: ${HYBRID_OCR:-1}
      USE_TROCR: ${USE_TROCR:-0}
      USE_HTR_LATIN: ${USE_HTR_LATIN:-1}
      HTR_ONNX: ${HTR_ONNX:-latin-g2-free}
      HTR_UNLOAD_AFTER_REQUEST: ${HTR_UNLOAD_AFTER_REQUEST:-1}
      MEMORY_PROFILE: ${MEMORY_PROFILE:-host}
      HW_BIAS: ${HW_BIAS:-1}
      CLASSIFIER_BACKEND: ${CLASSIFIER_BACKEND:-heuristic}
      PRINTED_FALLBACK_CONF: ${PRINTED_FALLBACK_CONF:-0.5}
      HANDWRITING_THRESHOLD: ${HANDWRITING_THRESHOLD:-0.35}
      HANDWRITING_MIN_LEN: ${HANDWRITING_MIN_LEN:-2}
      HANDWRITING_PADDLE_KEEP: ${HANDWRITING_PADDLE_KEEP:-0.55}
      HANDWRITING_PADDLE_KEEP_PHOTO: ${HANDWRITING_PADDLE_KEEP_PHOTO:-0.90}
      TROCR_UNLOAD_AFTER_REQUEST: ${TROCR_UNLOAD_AFTER_REQUEST:-1}
      ORT_INTRA_THREADS: ${ORT_INTRA_THREADS:-2}
      OCR_ONNX_DIR: /root/.paddleocr/onnx
      TROCR_ONNX: trocr-small-handwritten-v1
    restart: unless-stopped
    volumes:
      - transitix_rai_paddle_models:/root/.paddleocr

volumes:
  transitix_rai_pg:
  transitix_rai_paddle_models:
