# RAI Spedition documents companion — isolated Postgres.
# OCR is Mistral cloud (MISTRAL_API_KEY) — no OCR containers here.
#
#   docker compose -f docker-compose.companion.yml up -d
#
# Postgres: localhost:5435 / DB transitix_rai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transitix_rai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - transitix_rai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-transitix_rai}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transitix_rai_pg:
